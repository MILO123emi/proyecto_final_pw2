name: VITE MPA publicar a GuitHub Pages

on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
env:
  DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL}}
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.github-pages.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el Repositorio
        uses: actions/checkout@v4
      - name: Instalar Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar dependencias del proyecto
        run: npm install
      - name: Compilar el pryecto en Dist
        run: npm run build
      - name: Configurar github pages para Publicar
        uses: actions/configure-pages@v5
      - name: Subir los compilares (DIST)
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
      - name: Publicar Artefactos
        uses: actions/deploy-pages@v4
        